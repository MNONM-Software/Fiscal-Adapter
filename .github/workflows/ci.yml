name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, simplexml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      # phpunit.xml excluye el grupo homologation: no corre contra servicios reales.
      - run: vendor/bin/pest
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse
